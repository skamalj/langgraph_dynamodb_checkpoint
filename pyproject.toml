[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph_dynamodb_checkpoint"
version = "0.5.0"
description = "LangGraph checkpoint saver for Amazon DynamoDB with built-in message history pruning via agentstate-reducer - single table, auto create, TTL and delete handling"
authors = [{name = "Kamal", email = "skamalj@github.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langgraph",
    "langgraph-checkpoint>=4.1.1",
    "boto3",
    "botocore"
]
keywords = [
    "langgraph", "checkpoint", "dynamodb", "aws",
    "message-reducer", "agent-state", "memory", "langchain"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
reducer = [
    "agentstate-reducer>=0.4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "langgraph-checkpoint-conformance",
    "pytest-cov",
    "black",
    "isort",
    "mypy"
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "langchain-openai",
    "langgraph_dynamodb_checkpoint[reducer]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_dynamodb_checkpoint"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

[project.urls]
Homepage = "https://github.com/skamalj/langgraph_dynamodb_checkpoint"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/skamalj/langgraph_dynamodb_checkpoint.git"
Issues = "https://github.com/skamalj/langgraph_dynamodb_checkpoint/issues"
Changelog = "https://github.com/skamalj/langgraph_dynamodb_checkpoint/blob/main/CHANGELOG.md"